<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>RentGo — Rental Motor Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#2563eb;--primary-dark:#1e40af;--primary-light:#dbeafe;
  --accent:#f59e0b;--success:#16a34a;--success-light:#dcfce7;
  --danger:#dc2626;--danger-light:#fee2e2;--warning:#f59e0b;--warning-light:#fef3c7;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--radius:14px;--radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --header-h:64px;
}
html,body{overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-xs{font-size:11px}
.font-bold{font-weight:700}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}

/* DARK MODE */
body.dark{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;
  --border:#334155;--primary-light:#1e3a8a;--success-light:#14532d;
  --danger-light:#7f1d1d;--warning-light:#78350f;
}
body.dark .header{background:#1e293b}
body.dark .motor-card,
body.dark .stat-card,
body.dark .history-item,
body.dark .seller-motor,
body.dark .empty,
body.dark .chat-list-item,
body.dark .notif-dropdown,
body.dark .notif-header,
body.dark .modal,
body.dark .modal-header,
body.dark .modal-footer,
body.dark .bank-info-card,
body.dark .bottom-nav{background:#1e293b;color:var(--text)}
body.dark .filter-tabs,
body.dark .search-box{background:#1e293b}
body.dark .search-box input{color:var(--text)}
body.dark .nav-btn{color:var(--muted)}
body.dark .nav-btn.active{background:#1e3a8a;color:#93c5fd}
body.dark .bottom-nav-btn{color:var(--muted)}
body.dark .bottom-nav-btn.active{color:#60a5fa}
body.dark .form-group input,
body.dark .form-group select,
body.dark .form-group textarea{background:#0f172a;color:var(--text);border-color:#334155}
body.dark .price-summary,
body.dark .detail-item,
body.dark .form-section{background:#0f172a}
body.dark .chat-messages{background:#0f172a}
body.dark .chat-bubble.other{background:#334155;color:var(--text)}
body.dark .chat-input-area{background:#1e293b}
body.dark .chat-input-area input{background:#0f172a;color:var(--text);border-color:#334155}
body.dark .notif-item:hover{background:#0f172a}
body.dark .notif-item.unread{background:#1e3a8a}
body.dark .modal-overlay{background:rgba(0,0,0,.75)}
body.dark .icon-btn{color:var(--text)}
body.dark .icon-btn:hover{background:#0f172a}
body.dark .user-menu:hover{background:#0f172a}
body.dark .photo-upload{background:#0f172a}
body.dark .photo-upload:hover{background:#1e3a8a}
body.dark .photo-preview{background:#0f172a}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-warning{background:var(--warning);color:#fff}
.btn-block{width:100%}.btn-sm{padding:7px 14px;font-size:13px}.btn-xs{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* AUTH */
.auth-wrap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth-left{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;width:400px;height:400px;background:rgba(255,255,255,.08);border-radius:50%;top:-100px;right:-100px}
.auth-left::after{content:'';position:absolute;width:300px;height:300px;background:rgba(255,255,255,.06);border-radius:50%;bottom:-80px;left:-80px}
.auth-logo{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;z-index:1}
.auth-logo i{font-size:30px;color:var(--accent)}
.auth-hero{z-index:1}.auth-hero h1{font-size:42px;line-height:1.15;margin-bottom:16px;font-weight:800}
.auth-hero p{font-size:16px;opacity:.9;max-width:400px}
.auth-features{z-index:1;display:flex;flex-direction:column;gap:14px}
.auth-feature{display:flex;align-items:center;gap:12px;font-size:14px}
.auth-feature i{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center}
.auth-right{display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow-y:auto;max-height:100vh}
.auth-form{width:100%;max-width:420px}
.auth-form h2{font-size:26px;margin-bottom:6px}
.auth-form .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;transition:border .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.role-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-option{padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.role-option:hover{border-color:var(--primary)}
.role-option.active{border-color:var(--primary);background:var(--primary-light)}
.role-option i{font-size:20px;color:var(--primary);margin-bottom:6px;display:block}
.role-option span{font-size:13px;font-weight:600}
.auth-switch{text-align:center;margin-top:20px;font-size:14px;color:var(--muted)}
.auth-switch a{color:var(--primary);font-weight:600;cursor:pointer}
.form-section{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--border)}
.form-section .section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.form-section .section-label i{color:var(--primary)}

/* HEADER */
.header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow);transition:background .3s}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:12px}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--primary);cursor:pointer;flex-shrink:0}
.logo i{color:var(--accent)}
.header-nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.header-nav::-webkit-scrollbar{display:none}
.nav-btn{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap;flex-shrink:0;position:relative}
.nav-btn:hover{background:var(--bg);color:var(--text)}
.nav-btn.active{background:var(--primary-light);color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:10px;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;transition:all .2s}
.icon-btn:hover{background:var(--bg)}
.icon-btn .badge{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.theme-toggle{background:transparent;border:1px solid var(--border);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text);cursor:pointer;transition:all .2s}
.theme-toggle:hover{background:var(--bg);color:var(--primary)}
.user-menu{display:flex;align-items:center;gap:10px;padding:4px;border-radius:12px;cursor:pointer}
.user-menu:hover{background:var(--bg)}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{font-size:13px}
.user-info .name{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-info .role{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:99;box-shadow:0 -2px 10px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom);transition:background .3s}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;height:64px;max-width:600px;margin:0 auto;padding:0 4px}
.bottom-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;padding:6px 2px;background:transparent;color:var(--muted);font-size:10px;font-weight:600;border-radius:8px;transition:all .2s;position:relative;min-width:0}
.bottom-nav-btn i{font-size:18px}
.bottom-nav-btn .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:10px}
.bottom-nav-btn.active{color:var(--primary)}
.bottom-nav-btn.active::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}
.bottom-nav-btn .badge{position:absolute;top:2px;right:8px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* MAIN */
.main{padding:20px 0 40px}
.page-title{margin-bottom:20px}
.page-title h1{font-size:22px;font-weight:800}
.page-title p{color:var(--muted);font-size:13px;margin-top:4px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-width:0;transition:background .3s}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-icon.blue{background:var(--primary-light);color:var(--primary)}
.stat-icon.green{background:var(--success-light);color:var(--success)}
.stat-icon.amber{background:var(--warning-light);color:var(--warning)}
.stat-icon.red{background:var(--danger-light);color:var(--danger)}
.stat-icon.purple{background:#ede9fe;color:#7c3aed}
.stat-info{min-width:0;flex:1}
.stat-info .val{font-size:18px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-info .label{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ACTIVE RENTAL */
.active-rental{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden}
.active-rental::before{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:rgba(37,99,235,.25);border-radius:50%}
.active-rental.pending{background:linear-gradient(135deg,#78350f,#92400e)}
.active-rental.pending::before{background:rgba(251,191,36,.25)}
.active-rental-info{flex:1;min-width:200px;z-index:1}
.active-rental-info h3{font-size:15px;margin-bottom:4px}
.active-rental-info p{font-size:12px;opacity:.75;line-height:1.4}
.active-rental-actions{display:flex;gap:8px;flex-wrap:wrap;z-index:1}
.timer-display{background:rgba(255,255,255,.1);padding:12px 18px;border-radius:12px;text-align:center;z-index:1;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);min-width:150px}
.timer-display .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.timer-display .time{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-display.overdue .time{color:#fca5a5}
.timer-display .status{font-size:10px;margin-top:2px;opacity:.8}
.timer-display.overdue{background:rgba(220,38,38,.2);border-color:rgba(220,38,38,.4)}

/* FILTER BAR */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filter-tabs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:12px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;max-width:100%}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);background:transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.filter-tab.active{background:var(--primary);color:#fff}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;padding:9px 14px;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);flex:1;min-width:200px}
.search-box input{border:none;outline:none;font-size:14px;width:100%;background:transparent;min-width:0}
.search-box i{color:var(--muted);flex-shrink:0}

/* MOTOR GRID */
.motor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.motor-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all .25s;cursor:pointer;border:1px solid transparent}
.motor-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.motor-img{height:160px;position:relative;overflow:hidden;background:#e2e8f0}
.motor-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.motor-card:hover .motor-img img{transform:scale(1.05)}
.motor-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}
.status-badge{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.status-badge .dot{width:6px;height:6px;border-radius:50%}
.status-badge.available .dot{background:var(--success)}.status-badge.available{color:var(--success)}
.status-badge.rented .dot{background:var(--danger)}.status-badge.rented{color:var(--danger)}
.rating-badge{position:absolute;top:10px;right:10px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(255,255,255,.95);color:#b45309;display:flex;align-items:center;gap:3px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.motor-body{padding:14px}
.motor-brand{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.motor-name{font-size:15px;font-weight:700;margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.motor-specs{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.motor-specs span{display:flex;align-items:center;gap:3px}
.motor-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);gap:8px}
.motor-price{font-size:16px;font-weight:800;color:var(--primary);white-space:nowrap}
.motor-price small{font-size:10px;font-weight:500;color:var(--muted)}
.seller-tag{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* EMPTY */
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.empty i{font-size:40px;color:var(--border);margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
.empty p{font-size:12px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s;backdrop-filter:blur(4px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:slideUp .25s;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal.modal-lg{max-width:680px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:18px 18px 0 0}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;flex-shrink:0}
.modal-close:hover{background:var(--danger-light);color:var(--danger)}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px;flex-wrap:wrap}

/* DETAIL */
.detail-hero{height:200px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:12px;margin-bottom:16px;position:relative;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.detail-item{background:var(--bg);padding:10px;border-radius:10px}
.detail-item .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.detail-item .val{font-size:13px;font-weight:600;margin-top:2px}
.detail-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}

/* PICKUP */
.pickup-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid var(--primary-light);border-radius:12px;padding:14px;margin-bottom:16px}
.pickup-card .loc{display:flex;align-items:flex-start;gap:10px}
.pickup-card i{color:var(--primary);font-size:16px;margin-top:2px;flex-shrink:0}
.pickup-card .loc-name{font-weight:700;font-size:13px}
.pickup-card .loc-detail{font-size:12px;color:var(--muted);margin-top:2px}
.pickup-card .map-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--primary);font-weight:600}

/* DURATION & PAYMENT */
.duration-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.duration-opt{padding:10px 8px;border:2px solid var(--border);border-radius:10px;background:#fff;font-size:12px;font-weight:600;transition:all .2s;text-align:center}
.duration-opt.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.payment-list{display:flex;flex-direction:column;gap:8px}
.payment-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;background:#fff}
.payment-opt:hover{border-color:var(--primary)}
.payment-opt.active{border-color:var(--primary);background:var(--primary-light)}
.payment-opt i{font-size:18px;color:var(--primary);width:24px;text-align:center;flex-shrink:0}
.payment-opt .info{flex:1;min-width:0}
.payment-opt .name{font-size:13px;font-weight:600}
.payment-opt .desc{font-size:11px;color:var(--muted)}
.price-summary{background:var(--bg);border-radius:12px;padding:14px;margin:14px 0}
.price-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:10px}
.price-row.total{border-top:1px solid var(--border);margin-top:8px;padding-top:10px;font-size:15px;font-weight:800;color:var(--primary)}

/* HISTORY */
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;border-left:4px solid var(--success);flex-wrap:wrap}
.history-item.overdue{border-left-color:var(--danger)}
.history-item.active{border-left-color:var(--primary)}
.history-item.pending{border-left-color:var(--warning)}
.history-icon{width:40px;height:40px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.history-icon.overdue{background:var(--danger-light);color:var(--danger)}
.history-icon.active{background:var(--success-light);color:var(--success)}
.history-icon.pending{background:var(--warning-light);color:var(--warning)}
.history-info{flex:1;min-width:150px}
.history-info h4{font-size:13px;font-weight:700}
.history-info p{font-size:11px;color:var(--muted);margin-top:2px}
.history-meta{text-align:right;font-size:11px;margin-left:auto}
.history-meta .price{font-weight:700;color:var(--primary);font-size:13px}
.history-meta .date{color:var(--muted);margin-top:2px}

/* TOGGLE */
.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:24px;transition:.3s}
.toggle-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle input:checked + .toggle-slider{background:var(--success)}
.toggle input:checked + .toggle-slider:before{transform:translateX(20px)}

/* SELLER MOTOR */
.seller-motor{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.seller-motor-img{width:70px;height:60px;border-radius:10px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.seller-motor-img img{width:100%;height:100%;object-fit:cover}
.seller-motor-info{flex:1;min-width:150px}
.seller-motor-info h4{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seller-motor-info .price{font-size:12px;color:var(--primary);font-weight:700;margin-top:2px}
.seller-motor-info .loc{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.seller-motor-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.status-toggle{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600}
.status-toggle.on{color:var(--success)}.status-toggle.off{color:var(--danger)}

/* TOAST */
.toast-container{position:fixed;top:16px;right:16px;left:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{background:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideIn .3s;border-left:4px solid var(--primary);pointer-events:auto;max-width:100%}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast i{font-size:16px;flex-shrink:0}
.toast.success i{color:var(--success)}
.toast.error i{color:var(--danger)}
.toast.warning i{color:var(--warning)}
.toast.info i{color:var(--primary)}
.toast .msg{font-size:12px;font-weight:500;line-height:1.4}

/* NOTIFICATION */
.notif-dropdown{position:fixed;top:70px;right:12px;left:12px;max-width:380px;margin-left:auto;max-height:70vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;border:1px solid var(--border);animation:slideUp .2s}
.notif-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:14px 14px 0 0}
.notif-header h4{font-size:13px;font-weight:700}
.notif-header button{font-size:11px;color:var(--primary);background:transparent;font-weight:600}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;cursor:pointer;transition:background .2s}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:#eff6ff}
.notif-item.unread:hover{background:#dbeafe}
.notif-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.notif-icon.booking{background:var(--primary-light);color:var(--primary)}
.notif-icon.payment{background:var(--success-light);color:var(--success)}
.notif-icon.warning{background:var(--warning-light);color:var(--warning)}
.notif-icon.danger{background:var(--danger-light);color:var(--danger)}
.notif-icon.review{background:#fef3c7;color:#b45309}
.notif-icon.chat{background:#ede9fe;color:#7c3aed}
.notif-content{flex:1;min-width:0}
.notif-content .title{font-size:12px;font-weight:600;margin-bottom:2px}
.notif-content .desc{font-size:11px;color:var(--muted);line-height:1.4;word-wrap:break-word}
.notif-content .time{font-size:10px;color:var(--muted);margin-top:3px}
.notif-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}
.notif-empty i{font-size:28px;color:var(--border);margin-bottom:8px;display:block}

/* CHAT */
.chat-container{display:flex;flex-direction:column;height:520px;max-height:80vh}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fff}
.chat-avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-info .name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-info .sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-messages{flex:1;overflow-y:auto;padding:14px;background:#f8fafc;display:flex;flex-direction:column;gap:10px}
.chat-bubble{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5;word-wrap:break-word;position:relative;animation:fadeIn .2s}
.chat-bubble.self{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.other{background:#fff;color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chat-bubble .time{font-size:9px;opacity:.75;margin-top:4px;display:block}
.chat-bubble img.chat-img{max-width:220px;max-height:220px;border-radius:10px;margin-bottom:6px;cursor:pointer;display:block;object-fit:cover}
.chat-bubble.self img.chat-img{border:2px solid rgba(255,255,255,.2)}
.chat-bubble .text-content{margin-top:2px}
.chat-input-area{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);background:#fff;align-items:center}
.chat-input-area input[type="text"]{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:24px;font-size:13px;outline:none;background:var(--bg);min-width:0}
.chat-input-area input[type="text"]:focus{border-color:var(--primary);background:#fff}
.chat-attach{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .2s}
.chat-attach:hover{background:var(--primary-light);color:var(--primary)}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .2s}
.chat-send:hover{background:var(--primary-dark)}
.chat-empty{text-align:center;color:var(--muted);font-size:12px;padding:40px 20px;margin:auto}
.chat-empty i{font-size:28px;color:var(--border);margin-bottom:8px;display:block}
.chat-photo-preview{padding:8px 10px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-photo-preview img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.chat-photo-preview .info{flex:1;font-size:11px;color:var(--muted)}
.chat-photo-preview button{width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

/* CHAT LIST */
.chat-list{display:flex;flex-direction:column;gap:10px}
.chat-list-item{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;border-left:4px solid transparent;position:relative}
.chat-list-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-left-color:var(--primary)}
.chat-list-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;overflow:hidden}
.chat-list-avatar img{width:100%;height:100%;object-fit:cover}
.chat-list-info{flex:1;min-width:0}
.chat-list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.chat-list-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-time{font-size:11px;color:var(--muted);flex-shrink:0}
.chat-list-motor{font-size:11px;color:var(--primary);font-weight:600;display:flex;align-items:center;gap:4px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.chat-list-preview.unread{color:var(--text);font-weight:600}
.chat-list-badge{background:var(--primary);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.chat-tab-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;margin-left:4px;vertical-align:middle}

/* REVIEW */
.stars{display:flex;gap:4px;font-size:22px;color:#cbd5e1;cursor:pointer}
.stars i.active{color:#f59e0b}
.review-summary{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bg);border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.review-score{text-align:center}
.review-score .num{font-size:28px;font-weight:800;color:var(--primary);line-height:1}
.review-score .count{font-size:10px;color:var(--muted);margin-top:4px}
.review-bar{flex:1;min-width:150px}
.review-bar .row{display:flex;align-items:center;gap:6px;font-size:10px}
.review-bar .row .bar{flex:1;height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.review-bar .row .bar div{height:100%;background:#f59e0b}
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{padding:12px;background:#fff;border:1px solid var(--border);border-radius:12px}
.review-item .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.review-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;overflow:hidden}
.review-avatar img{width:100%;height:100%;object-fit:cover}
.review-item .name{font-size:12px;font-weight:600}
.review-item .date{font-size:10px;color:var(--muted)}
.review-item .stars-mini{font-size:11px;color:#f59e0b;margin-bottom:4px}
.review-item .comment{font-size:12px;color:var(--text);line-height:1.5}

/* PHOTO UPLOAD */
.photo-upload{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.photo-upload:hover{border-color:var(--primary);background:var(--primary-light)}
.photo-upload i{font-size:26px;color:var(--muted);margin-bottom:6px;display:block}
.photo-upload .text{font-size:12px;font-weight:600}
.photo-upload .sub{font-size:10px;color:var(--muted);margin-top:2px}
.photo-preview{position:relative;width:100%;height:150px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#e2e8f0}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview .remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(220,38,38,.9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

/* PROFILE PHOTO */
.profile-photo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.profile-photo{width:110px;height:110px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;overflow:hidden;position:relative;cursor:pointer;border:4px solid var(--primary-light);transition:all .2s}
.profile-photo:hover{border-color:var(--primary)}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-photo .overlay-cam{position:absolute;bottom:0;right:0;background:var(--primary);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid #fff;color:#fff}
body.dark .profile-photo .overlay-cam{border-color:#1e293b}
.profile-photo-hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}

/* BALANCE */
.balance-card{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:rgba(37,99,235,.3);border-radius:50%}
.balance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;position:relative;z-index:1;margin-top:14px}
.balance-item{padding:10px;background:rgba(255,255,255,.08);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.balance-item .label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.balance-item .val{font-size:16px;font-weight:800;margin-top:4px}
.balance-item.pending .val{color:#fcd34d}
.balance-item.available .val{color:#86efac}

/* BANK CARD */
.bank-info-card{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px}
.bank-info-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.bank-info-card .head h4{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.bank-info-card .head h4 i{color:var(--primary)}
.bank-info-card .row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;gap:10px}
.bank-info-card .row .label{color:var(--muted)}
.bank-info-card .row .val{font-weight:600;text-align:right;word-break:break-all}
.bank-info-card .empty-bank{text-align:center;padding:16px;color:var(--muted);font-size:12px}
.bank-info-card .empty-bank i{font-size:24px;color:var(--border);display:block;margin-bottom:6px}

/* USER MENU DROPDOWN */
.user-dropdown{position:fixed;top:70px;right:12px;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);border:1px solid var(--border);min-width:230px;z-index:200;overflow:hidden;animation:slideUp .2s}
body.dark .user-dropdown{background:#1e293b}
.user-dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-dropdown-header .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0;font-size:14px}
.user-dropdown-header .avatar img{width:100%;height:100%;object-fit:cover}
.user-dropdown-header .info{min-width:0}
.user-dropdown-header .name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-dropdown-header .email{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-dropdown-item{padding:12px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .2s;color:var(--text)}
.user-dropdown-item:hover{background:var(--bg)}
body.dark .user-dropdown-item:hover{background:#0f172a}
.user-dropdown-item i{width:18px;color:var(--primary);font-size:14px}
.user-dropdown-item.danger{color:var(--danger)}
.user-dropdown-item.danger i{color:var(--danger)}

/* EXPORT */
.export-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-export{background:#fff;color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all .2s}
.btn-export:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
body.dark .btn-export{background:#1e293b}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s;cursor:pointer}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.lightbox .close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}

/* RESPONSIVE */
@media (max-width:768px){
  .auth-wrap{grid-template-columns:1fr}
  .auth-left{display:none}
  .header-nav{display:none}
  .bottom-nav{display:block}
  .main{padding:16px 0 90px}
  .user-info{display:none}
  .header-inner{gap:8px}
  .motor-grid{grid-template-columns:1fr 1fr;gap:12px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .active-rental{flex-direction:column;text-align:left}
  .active-rental-info{width:100%}
  .timer-display{width:100%;min-width:auto}
  .active-rental-actions{width:100%}
  .active-rental-actions .btn{flex:1;min-width:0}
  .detail-grid{grid-template-columns:1fr}
  .balance-grid{grid-template-columns:1fr}
  .chat-container{height:calc(100vh - 120px);max-height:none}
  .history-meta{margin-left:52px;width:calc(100% - 52px);text-align:left;display:flex;justify-content:space-between;align-items:center}
  .modal{border-radius:16px}
  .modal-header{padding:14px 16px}
  .modal-body{padding:16px}
  .modal-footer{padding:12px 16px}
  .filter-bar{flex-direction:column;align-items:stretch;gap:10px}
  .filter-tabs{width:100%}
  .search-box{width:100%}
  .user-dropdown{right:8px;left:8px;width:auto;max-width:calc(100vw - 16px)}
}
@media (max-width:480px){
  .motor-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
  .page-title h1{font-size:20px}
  .btn{padding:10px 16px;font-size:13px}
  .logo{font-size:17px}
  .logo i{font-size:22px}
  .balance-card{padding:16px}
  .balance-grid{grid-template-columns:1fr}
}
@media (max-width:360px){
  .bottom-nav-btn .label{font-size:9px}
  .bottom-nav-btn i{font-size:16px}
  .container{padding:0 12px}
}
</style>

<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   KONFIGURASI
   ============================================================ */
const STORAGE_KEY='rentgo_v5';
const COMMISSION_RATE=0.10;

const MOTOR_PHOTOS={
  vario:'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&h=600&fit=crop',
  beat:'https://images.unsplash.com/photo-1591637333184-19aa84b3e01f?w=800&h=600&fit=crop',
  nmax:'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=800&h=600&fit=crop',
  scoopy:'https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?w=800&h=600&fit=crop',

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      users:state.users, motors:state.motors, rentals:state.rentals,
      reviews:state.reviews, chats:state.chats, notifications:state.notifications,
      currentUser:state.currentUser
    }));
  } catch(e){
    console.warn('Storage quota exceeded',e);
    toast('Penyimpanan browser penuh','warning');
  }
}
function loadState(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw){
    state.users=JSON.parse(JSON.stringify(SEED_USERS));
    state.motors=JSON.parse(JSON.stringify(SEED_MOTORS));
    saveState();return;
  }
  try {
    const d=JSON.parse(raw);
    state.users=d.users||JSON.parse(JSON.stringify(SEED_USERS));
    state.motors=d.motors||JSON.parse(JSON.stringify(SEED_MOTORS));
    state.rentals=d.rentals||[];
    state.reviews=d.reviews||[];
    state.chats=d.chats||[];
    state.notifications=d.notifications||[];
    state.currentUser=d.currentUser||null;
  } catch(e){
    state.users=JSON.parse(JSON.stringify(SEED_USERS));
    state.motors=JSON.parse(JSON.stringify(SEED_MOTORS));
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function uid(p='id'){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function rupiah(n){ return 'Rp'+Math.round(n).toLocaleString('id-ID'); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatTime(ms){
  if(ms<0)ms=0;
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function formatDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return'Baru saja';
  if(m<60)return m+'m lalu';
  const h=Math.floor(m/60);
  if(h<24)return h+'j lalu';
  return Math.floor(h/24)+'h lalu';
}
function initials(name){ return name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase(); }
function maskAccount(num){
  if(!num)return'-';
  const s=String(num).replace(/\s/g,'');
  if(s.length<=4)return s;
  return '*'.repeat(Math.min(s.length-4,8))+' '+s.slice(-4);
}
function renderAvatar(user,size=38){
  if(!user)return`<span style="font-size:${Math.round(size*0.4)}px">?</span>`;
  const fontSize=Math.round(size*0.4);
  if(user.photo){
    return `<img src="${user.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="${esc(user.name)}">`;
  }
  return `<span style="font-size:${fontSize}px">${initials(user.name)}</span>`;
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  const icons={info:'fa-circle-info',success:'fa-circle-check',error:'fa-circle-exclamation',warning:'fa-triangle-exclamation'};
  el.innerHTML=`<i class="fa-solid ${icons[type]||icons.info}"></i><span class="msg">${esc(msg)}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(100%)';setTimeout(()=>el.remove(),300);},3500);
}

}

/* ============================================================
   EXPORT CSV
   ============================================================ */
function exportRentalsCSV(scope='buyer'){
  let data=[];
  if(scope==='buyer'){
    data=state.rentals.filter(r=>r.buyerId===state.currentUser.id);
  } else {
    data=state.rentals.filter(r=>r.sellerId===state.currentUser.id);
  }
  if(data.length===0){toast('Belum ada data untuk diexport','warning');return;}
  const headers=['ID','Motor','Tanggal','Durasi (jam)','Total','Metode','Status','Lawan Transaksi'];
  const rows=data.map(r=>{
    const motor=state.motors.find(m=>m.id===r.motorId);
    const otherId=scope==='buyer'?r.sellerId:r.buyerId;
    const other=state.users.find(u=>u.id===otherId);
    return [
      r.id.slice(-8),
      motor?`${motor.brand} ${motor.name}`:'-',
      formatDate(r.createdAt),
      r.durationHours,
      r.totalPrice,
      r.paymentMethod,
      r.status,
      other?.name||'-'
    ];
  });
  const csv=[headers,...rows]
    .map(row=>row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(','))
    .join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`RentGo_${scope==='buyer'?'HistoriSaya':'Pendapatan'}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data berhasil diexport ke CSV','success');
}

function renderChatList(){
  const userId=state.currentUser.id;
  const myRentals=state.rentals.filter(r=>r.buyerId===userId||r.sellerId===userId);
  const conversations=myRentals.map(r=>{
    const chats=state.chats.filter(c=>c.rentalId===r.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const lastMsg=chats[0];
    const unread=chats.filter(c=>c.receiverId===userId&&!c.read).length;
    const otherId=userId===r.buyerId?r.sellerId:r.buyerId;
    const other=state.users.find(u=>u.id===otherId);
    const motor=state.motors.find(m=>m.id===r.motorId);
    return {rental:r,other,motor,lastMsg,unread,hasChat:chats.length>0};
  })
  .filter(c=>c.hasChat||c.rental.status==='active'||c.rental.status==='booked')
  .sort((a,b)=>{
    const ta=a.lastMsg?new Date(a.lastMsg.createdAt).getTime():new Date(a.rental.createdAt).getTime();
    const tb=b.lastMsg?new Date(b.lastMsg.createdAt).getTime():new Date(b.rental.createdAt).getTime();
    return tb-ta;
  });
  const otherRoleLabel=state.currentUser.role==='buyer'?'Penyedia':'Penyewa';
  if(conversations.length===0){
    return `
      <div class="page-title"><h1>Chat</h1><p>Percakapan dengan ${otherRoleLabel.toLowerCase()}.</p></div>
      <div class="empty"><i class="fa-solid fa-comments"></i><h3>Belum ada chat</h3><p>Chat akan muncul setelah ada booking motor.</p></div>
    `;
  }
  return `
    <div class="page-title"><h1>Chat</h1><p>Percakapan dengan ${otherRoleLabel.toLowerCase()}.</p></div>
    <div class="chat-list">
      ${conversations.map(c=>{
        let preview='Belum ada pesan';
        if(c.lastMsg){
          if(c.lastMsg.photo&&!c.lastMsg.text)preview='[Foto]';
          else if(c.lastMsg.photo&&c.lastMsg.text)preview='[Foto] '+c.lastMsg.text;
          else preview=c.lastMsg.text;
        }
        const isSelf=c.lastMsg&&c.lastMsg.senderId===userId;
        const statusIcon=c.rental.status==='active'?'🟢':c.rental.status==='booked'?'🟡':'⚪';
        return `
          <div class="chat-list-item" data-open-chat="${c.rental.id}">
            <div class="chat-list-avatar">${renderAvatar(c.other,48)}</div>
            <div class="chat-list-info">
              <div class="chat-list-head">
                <div class="chat-list-name">${esc(c.other?.name||'-')}</div>
                <div class="chat-list-time">${c.lastMsg?timeAgo(c.lastMsg.createdAt):timeAgo(c.rental.createdAt)}</div>
              </div>
              <div class="chat-list-motor"><i class="fa-solid fa-motorcycle"></i> ${statusIcon} ${esc(c.motor?.name||'Motor')}</div>
              <div class="chat-list-preview ${c.unread>0?'unread':''}">
                ${isSelf?'<i class="fa-solid fa-check"></i>':''}
                ${esc(preview.length>55?preview.slice(0,55)+'...':preview)}
              </div>
            </div>
            ${c.unread>0?`<div class="chat-list-badge">${c.unread>9?'9+':c.unread}</div>`:''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function attachSellerHandlers(){
  document.querySelectorAll('[data-toggle-motor]').forEach(el=>{
    el.onchange=()=>{
      const motor=state.motors.find(m=>m.id===el.dataset.toggleMotor);
      if(motor){motor.isOpen=el.checked;saveState();toast(`Motor ${motor.name} ${motor.isOpen?'dibuka':'ditutup'}`,motor.isOpen?'success':'info');render();}
    };
  });
  document.querySelectorAll('[data-delete-motor]').forEach(btn=>{
    btn.onclick=()=>{

      if(isMotorRented(id)){toast('Tidak bisa hapus motor yang sedang disewa','error');return;}
      if(!confirm('Yakin hapus motor ini?'))return;
      state.motors=state.motors.filter(m=>m.id!==id);saveState();toast('Motor dihapus','success');render();
    };
  });
  document.querySelectorAll('[data-edit-motor]').forEach(btn=>{btn.onclick=()=>openMotorForm(btn.dataset.editMotor);});
  const addBtn=document.getElementById('addMotorBtn');
  if(addBtn)addBtn.onclick=()=>openMotorForm(null);
  const withdraw=document.getElementById('withdrawBtn');
  if(withdraw)withdraw.onclick=()=>{
    const u=state.users.find(x=>x.id===state.currentUser.id);
    if(!u.bank){toast('Tambahkan rekening terlebih dahulu','error');return;}
    if(!u.balance||u.balance<=0){toast('Saldo tidak mencukupi','error');return;}

    u.balance=0;saveState();

/* ============================================================
   RENTAL FLOW
   ============================================================ */
function confirmPickup(rentalId){
  const r=state.rentals.find(x=>x.id===rentalId);
  if(!r||r.status!=='booked')return;
  r.status='active';
  r.startTime=new Date().toISOString();
  r.pickupConfirmedAt=new Date().toISOString();
  saveState();
  const motor=state.motors.find(m=>m.id===r.motorId);
  const buyer=state.users.find(u=>u.id===r.buyerId);
  pushNotif(r.buyerId,'booking','Motor Diambil',`Timer untuk ${motor?.name||'motor'} telah dimulai.`,r.id);
  pushNotif(r.sellerId,'booking','Motor Diambil',`${buyer?.name||'Penyewa'} telah mengambil ${motor?.name||'motor'}.`,r.id);
  toast('Timer dimulai!','success');
  render();
}
function confirmReturn(rentalId){
  const r=state.rentals.find(x=>x.id===rentalId);
  if(!r||r.status!=='active')return;
  if(!confirm('Konfirmasi motor telah dikembalikan dengan baik?'))return;
  r.status='completed';
  r.completedAt=new Date().toISOString();
  r.commission=Math.round(r.totalPrice*COMMISSION_RATE);
  r.sellerPayout=r.totalPrice-r.commission;
  const seller=state.users.find(u=>u.id===r.sellerId);
  if(seller){seller.balance=(seller.balance||0)+r.sellerPayout;}
  saveState();
  const motor=state.motors.find(m=>m.id===r.motorId);
  pushNotif(r.buyerId,'payment','Rental Selesai',`Terima kasih! Rental ${motor?.name||'motor'} selesai. Jangan lupa beri rating.`,r.id);
  pushNotif(r.sellerId,'payment','Pembayaran Diterima',`${rupiah(r.sellerPayout)} masuk ke saldo kamu (komisi: ${rupiah(r.commission)}).`,r.id);
  toast('Rental selesai.','success');
  render();
}

    }
    saveState();overlay.remove();render();
  };

    const accountNumber=document.getElementById('bankAccount').value.trim();
    const accountHolder=document.getElementById('bankHolder').value.trim();
    if(!bankName||!accountNumber||!accountHolder){toast('Semua field wajib diisi','error');return;}
    if(accountNumber.length<8){toast('Nomor rekening tidak valid','error');return;}
    u.bank={bankName,accountNumber,accountHolder};
    saveState();
    toast('Data rekening tersimpan','success');
    overlay.remove();render();
  };
}

/* ============================================================
   PROFILE MODAL
   ============================================================ */
function openProfileModal(){
  const u=state.users.find(x=>x.id===state.currentUser.id);
  let photoData=u.photo||'';
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-header"><h3>Edit Profil</h3><button class="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body">
        <div class="profile-photo-wrap">
          <div class="profile-photo" id="profilePhoto">
            ${photoData?`<img src="${photoData}">`:`<span>${initials(u.name)}</span>`}
            <div class="overlay-cam"><i class="fa-solid fa-camera"></i></div>
          </div>
          <div class="profile-photo-hint">Klik foto untuk mengganti</div>
          <input type="file" id="profilePhotoInput" accept="image/*" class="hidden">
        </div>
        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="profName" value="${esc(u.name)}"></div>
        <div class="form-group"><label>Email (tidak dapat diubah)</label><input type="email" id="profEmail" value="${esc(u.email)}" disabled style="opacity:.6;cursor:not-allowed"></div>
        <div class="form-group"><label>No. WhatsApp</label><input type="tel" id="profPhone" value="${esc(u.phone||'')}" placeholder="0812-xxxx-xxxx"></div>
        ${u.role==='seller'?`
          <div class="form-section">
            <div class="section-label"><i class="fa-solid fa-building-columns"></i> Data Rekening</div>
            <div class="form-group">
              <label>Nama Bank</label>
              <select id="profBankName">
                ${['BCA','BRI','Mandiri','BNI','BSI','CIMB Niaga','Permata','Danamon','BTN','Bank Jabar (BJB)','Bank DKI','Lainnya'].map(x=>`<option ${u.bank?.bankName===x?'selected':''}>${x}</option>`).join('')}
              </select>
            </div>
            <div class="form-group"><label>Nomor Rekening</label><input type="text" id="profBankAccount" value="${esc(u.bank?.accountNumber||'')}" inputmode="numeric"></div>
            <div class="form-group"><label>Atas Nama</label><input type="text" id="profBankHolder" value="${esc(u.bank?.accountHolder||'')}"></div>
          </div>
        `:''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-close-btn">Batal</button>
        <button class="btn btn-primary" id="saveProfileBtn"><i class="fa-solid fa-check"></i> Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.modal-close, .modal-close-btn').forEach(b=>b.onclick=()=>overlay.remove());
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  const photoInput=document.getElementById('profilePhotoInput');
  document.getElementById('profilePhoto').onclick=()=>photoInput.click();
  photoInput.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>2*1024*1024){toast('Ukuran foto max 2MB','error');return;}
    const reader=new FileReader();
    reader.onload=(ev)=>{
      photoData=ev.target.result;
      document.getElementById('profilePhoto').innerHTML=`<img src="${photoData}"><div class="overlay-cam"><i class="fa-solid fa-camera"></i></div>`;
      document.getElementById('profilePhoto').onclick=()=>photoInput.click();
    };
    reader.readAsDataURL(file);
  };
  document.getElementById('saveProfileBtn').onclick=()=>{
    const name=document.getElementById('profName').value.trim();
    const phone=document.getElementById('profPhone').value.trim();
    if(!name){toast('Nama wajib diisi','error');return;}
    u.name=name;u.phone=phone;u.photo=photoData;
    if(u.role==='seller'){
      const bankName=document.getElementById('profBankName').value;
      const accountNumber=document.getElementById('profBankAccount').value.trim();
      const accountHolder=document.getElementById('profBankHolder').value.trim();
      if(bankName&&accountNumber&&accountHolder){
        u.bank={bankName,accountNumber,accountHolder};
      }
    }
    state.currentUser=u;saveState();
    toast('Profil berhasil disimpan','success');
    overlay.remove();render();
  };
}

/* ============================================================
   USER MENU DROPDOWN
   ============================================================ */
function toggleUserMenu(){
  const existing=document.querySelector('.user-dropdown');
  if(existing){existing.remove();return;}
  const u=state.currentUser;
  const dd=document.createElement('div');
  dd.className='user-dropdown';
  dd.innerHTML=`
    <div class="user-dropdown-header">
      <div class="avatar">${renderAvatar(u,40)}</div>
      <div class="info">
        <div class="name">${esc(u.name)}</div>
        <div class="email">${esc(u.email)}</div>
      </div>
    </div>
    <div class="user-dropdown-item" data-action="profile"><i class="fa-solid fa-user"></i> Edit Profil</div>
    ${u.role==='seller'?`<div class="user-dropdown-item" data-action="bank"><i class="fa-solid fa-building-columns"></i> Rekening Payout</div>`:''}
    <div class="user-dropdown-item" data-action="theme"><i class="fa-solid fa-${document.body.classList.contains('dark')?'sun':'moon'}"></i> Mode ${document.body.classList.contains('dark')?'Terang':'Gelap'}</div>
    <div class="user-dropdown-item danger" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</div>
  `;
  document.body.appendChild(dd);
  setTimeout(()=>{document.addEventListener('click',closeUserMenuOnClick);},0);
  dd.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const action=el.dataset.action;
      dd.remove();document.removeEventListener('click',closeUserMenuOnClick);
      if(action==='profile')openProfileModal();
      else if(action==='bank')openBankForm();
      else if(action==='theme')toggleTheme();
      else if(action==='logout'){
        if(!confirm('Yakin keluar dari akun?'))return;
        state.currentUser=null;
        state.buyerTab='browse';state.sellerTab='dashboard';
        saveState();render();toast('Kamu telah keluar','info');
      }
    };
  });
  dd.onclick=(e)=>e.stopPropagation();
}
function closeUserMenuOnClick(e){
  const dd=document.querySelector('.user-dropdown');
  const menu=document.getElementById('userMenu');
  if(dd&&!dd.contains(e.target)&&e.target!==menu&&!menu.contains(e.target)){
    dd.remove();
    document.removeEventListener('click',closeUserMenuOnClick);
  }
}

/* ============================================================
   CHAT
   ============================================================ */
function openChat(rentalId){
  const r=state.rentals.find(x=>x.id===rentalId);
  if(!r)return;
  const otherId=state.currentUser.id===r.buyerId?r.sellerId:r.buyerId;
  const other=state.users.find(u=>u.id===otherId);
  const motor=state.motors.find(m=>m.id===r.motorId);
  let pendingPhoto=null;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal">
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-avatar">${renderAvatar(other,38)}</div>
          <div class="chat-info"><div class="name">${esc(other?.name||'-')}</div><div class="sub">${esc(motor?.name||'Motor')} · #${r.id.slice(-5)}</div></div>
          <button class="modal-close" style="position:static"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div id="photoPreviewArea"></div>
        <div class="chat-input-area">
          <button class="chat-attach" id="chatAttach" title="Kirim foto"><i class="fa-solid fa-camera"></i></button>
          <input type="file" id="chatPhotoInput" accept="image/*" class="hidden">
          <input type="text" id="chatInput" placeholder="Ketik pesan..." autocomplete="off">
          <button class="chat-send" id="chatSend"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <a class="btn btn-secondary btn-sm" href="https://wa.me/${(other?.phone||'').replace(/\D/g,'')}" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
        <button class="btn btn-secondary btn-sm modal-close-btn">Tutup</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.modal-close, .modal-close-btn').forEach(b=>b.onclick=()=>overlay.remove());
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  const msgsEl=document.getElementById('chatMessages');
  const inputEl=document.getElementById('chatInput');
  const sendEl=document.getElementById('chatSend');
  const attachEl=document.getElementById('chatAttach');
  const photoInput=document.getElementById('chatPhotoInput');
  const previewArea=document.getElementById('photoPreviewArea');
  function renderMessages(){
    const msgs=state.chats.filter(c=>c.rentalId===rentalId).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    let changed=false;
    msgs.forEach(m=>{if(m.receiverId===state.currentUser.id&&!m.read){m.read=true;changed=true;}});
    if(changed){saveState();renderNotifBell();updateChatBadges();}
    if(msgs.length===0){
      msgsEl.innerHTML=`<div class="chat-empty"><i class="fa-solid fa-comments"></i>Belum ada pesan.<br>Mulai percakapan dengan ${esc(other?.name||'seller')}.</div>`;
      return;
    }
    msgsEl.innerHTML=msgs.map(m=>{
      const self=m.senderId===state.currentUser.id;
      return `<div class="chat-bubble ${self?'self':'other'}">
        ${m.photo?`<img src="${m.photo}" class="chat-img" onclick="openLightbox('${m.photo}')" alt="Foto">`:''}
        ${m.text?`<div class="text-content">${esc(m.text)}</div>`:''}
        <span class="time">${timeAgo(m.createdAt)}${self&&m.read?' · ✓✓':''}</span>
      </div>`;
    }).join('');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  function updatePreview(){
    if(pendingPhoto){
      previewArea.innerHTML=`
        <div class="chat-photo-preview">
          <img src="${pendingPhoto}">
          <div class="info"><i class="fa-solid fa-image"></i> Foto siap dikirim</div>
          <button id="removePhotoChat"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `;
      document.getElementById('removePhotoChat').onclick=()=>{pendingPhoto=null;previewArea.innerHTML='';};
    } else {
      previewArea.innerHTML='';
    }
  }
  function sendMessage(){
    const text=inputEl.value.trim();
    if(!text&&!pendingPhoto)return;
    const msg={
      id:uid('c'),rentalId,
      senderId:state.currentUser.id,receiverId:otherId,
      text:text||'',photo:pendingPhoto||null,
      read:false,createdAt:new Date().toISOString()
    };
    state.chats.push(msg);saveState();
    inputEl.value='';pendingPhoto=null;updatePreview();
    renderMessages();
    let notifMsg=text?text.slice(0,40):'[Foto]';
    pushNotif(otherId,'chat','Pesan Baru',`${state.currentUser.name}: ${notifMsg}${(text.length>40)?'...':''}`,rentalId);
  }
  attachEl.onclick=()=>photoInput.click();
  photoInput.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>5*1024*1024){toast('Ukuran foto max 5MB','error');return;}
    const reader=new FileReader();
    reader.onload=(ev)=>{pendingPhoto=ev.target.result;updatePreview();};
    reader.readAsDataURL(file);
    e.target.value='';
  };
  sendEl.onclick=sendMessage;
  inputEl.onkeydown=(e)=>{if(e.key==='Enter')sendMessage();};
  renderMessages();
  setTimeout(()=>inputEl.focus(),100);
}

/* ============================================================
   LIGHTBOX
   ============================================================ */

  const lb=document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML=`<img src="${src}"><button class="close"><i class="fa-solid fa-xmark"></i></button>`;
  lb.onclick=()=>lb.remove();
  document.body.appendChild(lb);
}

/* ============================================================
   REVIEW
   ============================================================ */
function openReviewModal(rentalId){
  const r=state.rentals.find(x=>x.id===rentalId);
  if(!r)return;
  const motor=state.motors.find(m=>m.id===r.motorId);
  let rating=5;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-header"><h3>Beri Rating & Ulasan</h3><button class="modal-close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body">
        <div style="text-align:center;margin-bottom:20px">
          <div class="section-title">Bagaimana pengalamanmu?</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:16px">${esc(motor?.name||'Motor')}</div>
          <div class="stars" id="starPicker" style="justify-content:center">
            ${[1,2,3,4,5].map(n=>`<i class="fa-solid fa-star active" data-star="${n}"></i>`).join('')}
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--muted)" id="ratingText">Sangat Baik (5/5)</div>
        </div>
        <div class="form-group"><label>Komentar (opsional)</label><textarea id="reviewComment" rows="4" placeholder="Ceritakan pengalamanmu..."></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary modal-close-btn">Batal</button><button class="btn btn-primary" id="submitReview">Kirim</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const ratingTexts={1:'Sangat Buruk (1/5)',2:'Buruk (2/5)',3:'Cukup (3/5)',4:'Baik (4/5)',5:'Sangat Baik (5/5)'};
  overlay.querySelectorAll('.modal-close, .modal-close-btn').forEach(b=>b.onclick=()=>overlay.remove());
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.querySelectorAll('#starPicker i').forEach(star=>{
    star.onclick=()=>{
      rating=parseInt(star.dataset.star);
      overlay.querySelectorAll('#starPicker i').forEach(s=>{s.classList.toggle('active',parseInt(s.dataset.star)<=rating);});
      document.getElementById('ratingText').textContent=ratingTexts[rating];
    };
  });
  document.getElementById('submitReview').onclick=()=>{
    const comment=document.getElementById('reviewComment').value.trim();
    const review={id:uid('rv'),rentalId,motorId:r.motorId,buyerId:state.currentUser.id,sellerId:r.sellerId,rating,comment:comment||'Tidak ada komentar.',createdAt:new Date().toISOString()};
    state.reviews.push(review);saveState();
    pushNotif(r.sellerId,'review','Ulasan Baru',`${state.currentUser.name} memberi rating ${rating}/5 untuk ${motor?.name||'motor'}.`,r.id);
    toast('Terima kasih atas ulasanmu!','success');
    overlay.remove();render();
  };
}
function getMotorRating(motorId){
  const reviews=state.reviews.filter(r=>r.motorId===motorId);
  if(reviews.length===0)return{avg:0,count:0};
  const avg=reviews.reduce((s,r)=>s+r.rating,0)/reviews.length;
  return{avg,count:reviews.length};
}

/* ============================================================
   NOTIFICATION DROPDOWN
   ============================================================ */
function toggleNotifDropdown(){
  const existing=document.querySelector('.notif-dropdown');
  if(existing){existing.remove();return;}
  const notifs=state.notifications.filter(n=>n.userId===state.currentUser.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const dd=document.createElement('div');
  dd.className='notif-dropdown';
  const icons={booking:'fa-calendar-check',payment:'fa-money-bill-wave',warning:'fa-triangle-exclamation',danger:'fa-circle-exclamation',review:'fa-star',chat:'fa-comments'};
  dd.innerHTML=`
    <div class="notif-header"><h4>Notifikasi</h4><button id="markAllRead">Tandai dibaca</button></div>
    ${notifs.length===0?`<div class="notif-empty"><i class="fa-solid fa-bell-slash"></i>Belum ada notifikasi</div>`:
      notifs.slice(0,20).map(n=>`
        <div class="notif-item ${n.read?'':'unread'}" data-notif="${n.id}">
          <div class="notif-icon ${n.type}"><i class="fa-solid ${icons[n.type]||'fa-bell'}"></i></div>
          <div class="notif-content">
            <div class="title">${esc(n.title)}</div>
            <div class="desc">${esc(n.message)}</div>
            <div class="time">${timeAgo(n.createdAt)}</div>
          </div>
        </div>
      `).join('')}
  `;
  document.body.appendChild(dd);
  setTimeout(()=>{document.addEventListener('click',closeNotifOnClick);},0);
  dd.querySelector('#markAllRead').onclick=(e)=>{
    e.stopPropagation();
    state.notifications.filter(n=>n.userId===state.currentUser.id).forEach(n=>n.read=true);
    saveState();renderNotifBell();dd.remove();
  };
  dd.querySelectorAll('[data-notif]').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const n=state.notifications.find(x=>x.id===el.dataset.notif);
      if(n){n.read=true;saveState();renderNotifBell();}
      dd.remove();
      if(n&&n.rentalId&&n.type==='chat'){openChat(n.rentalId);}
      else if(n&&n.rentalId){render();}
    };
  });
  dd.onclick=(e)=>e.stopPropagation();
}
function closeNotifOnClick(e){
  const dd=document.querySelector('.notif-dropdown');
  const btn=document.getElementById('notifBtn');
  if(dd&&!dd.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
    dd.remove();
    document.removeEventListener('click',closeNotifOnClick);
  }
}

/* ============================================================
   TIMER
   ============================================================ */
let timerInterval=null;
function startTimers(){
  if(timerInterval)clearInterval(timerInterval);
  const tick=()=>{
    document.querySelectorAll('[data-timer]').forEach(el=>{
      const start=new Date(el.dataset.start).getTime();
      const durationMs=parseInt(el.dataset.duration)*3600*1000;
      const remaining=start+durationMs-Date.now();
      const timeEl=el.querySelector('[data-time]');
      if(!timeEl)return;
      if(remaining>=0){
        timeEl.textContent=formatTime(remaining);
        el.classList.remove('overdue');
      } else {
        timeEl.textContent=formatTime(Math.abs(remaining));
        el.classList.add('overdue');
      }
    });
  };
  tick();
  timerInterval=setInterval(tick,1000);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  if(!state.currentUser)renderAuth();
  else if(state.currentUser.role==='buyer')renderBuyer();
  else renderSeller();
  startTimers();
}

loadState();
render();
</script>
